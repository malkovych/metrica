# Metrica — XcodeGen (App Store ready)
name: Metrica
options:
  bundleIdPrefix: com.metrica
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
targets:
  Metrica:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Domain
      - path: Features
      - path: DesignSystem
      - path: MockServer
        excludes:
          - "**/*.py"
          - "**/Fixtures/**"
      - path: Resources
        excludes:
          - Info.plist
      - path: MockServer/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metrica.app
        PRODUCT_NAME: Metrica
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: Resources/Metrica.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Metrica
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.business"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets:
        - MetricaTests
        - MetricaUITests
  MetricaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Metrica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metrica.app.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Metrica.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Metrica"
  MetricaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Metrica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metrica.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: Metrica
schemes:
  Metrica:
    build:
      targets:
        Metrica: all
    test:
      targets:
        - MetricaTests
        - MetricaUITests
    archive:
      config: Release
